<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Droid</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #9ef; font-family: -apple-system, system-ui, sans-serif;
    overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #caption { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); text-align: center;
    font-size: 15px; opacity: .7; min-height: 2.4em; pointer-events: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 20px; align-items: center;
    justify-content: center; background: #000; }
  #start button { font-size: 22px; color: #9ef; background: transparent; border: 2px solid #9ef; border-radius: 28px;
    padding: 16px 32px; min-width: 260px; }
  #start button.preselected { background: #123; }
  #stop { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 12px; padding: 10px 16px; font-size: 16px;
    border-radius: 20px; border: 2px solid #f55; background: rgba(0,0,0,.6); color: #f55; display: none; }
</style>
</head>
<body>
<canvas id="face"></canvas>
<div id="caption"></div>
<button id="stop">STOP</button>
<div id="start">
  <button data-provider="grok">Wake with Grok</button>
  <button data-provider="gemini">Wake with Gemini</button>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
